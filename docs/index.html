<!DOCTYPE html>

<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>

            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);

            -webkit-text-fill-color: transparent;

<body class="bg-slate-900 text-slate-100 font-sans leading-relaxed">

    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto">

        <p class="text-xl text-slate-400 mb-10">
            A multi-agent system that extracts garment DNA, generates photorealistic fashion models, and self-corrects using a Critic-loop.
        </p>
        <div class="flex justify-center gap-4">
            <span class="bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-sm">Python</span>

    <section id="architecture" class="py-16 bg-slate-800/50">
        <div class="max-w-6xl mx-auto px-6">
            <h2 class="text-3xl font-bold mb-12 text-center">System Architecture</h2>
            <div class="grid md:grid-cols-2 gap-12 items-center">

                    </div>
                    <div class="p-4 bg-slate-900 rounded-lg border-l-4 border-pink-500">
                        <h3 class="font-bold">3. Verification Agent</h3>

                    </div>
                </div>
            </div>
        </div>
